<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Web & AI Agency</title>
    <style>
        /* Cinematic & Premium Dark Theme */
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: #0d0d0d;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            width: 100%;
            padding: 40px 20px;
            text-align: center;
            background: linear-gradient(180deg, #1a1a1a 0%, #0d0d0d 100%);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 3rem;
            margin: 0;
            background: -webkit-linear-gradient(#fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }
        p.subtitle {
            color: #aaaaaa;
            font-size: 1.2rem;
            margin-top: 10px;
        }
        .container {
            width: 90%;
            max-width: 800px;
            margin: 50px 0;
            background: #151515;
            padding: 40px;
            border-radius: 20px;
            border: 1px solid #333;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }
        .form-group {
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-bottom: 10px;
            font-size: 1.1rem;
            color: #dddddd;
        }
        select, input, textarea {
            width: 100%;
            padding: 15px;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }
        select:focus, input:focus, textarea:focus {
            border-color: #00ffcc;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
        }
        .price-display {
            background: linear-gradient(135deg, #00ffcc 0%, #0066ff 100%);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            margin-top: 30px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #000;
        }
        button {
            width: 100%;
            padding: 18px;
            margin-top: 20px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background: #cccccc;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <header>
        <!-- Yahan par 'ELITE WEB & AI' ki jagah apna final naam likh lena jab decide ho jaye -->
        <h1>ELITE WEB & AI</h1>
        <p class="subtitle">Next-Generation Websites & AI Chatbots for Your Business</p>
    </header>

    <div class="container">
        <h2>Start Your Project</h2>
        <form id="orderForm">
            
            <!-- Client Details -->
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" placeholder="John Doe" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="john@company.com" required>
            </div>
            <div class="form-group">
                <label>Tell us about your business</label>
                <textarea rows="4" placeholder="I need a website for..."></textarea>
            </div>

            <!-- Website Selection -->
            <div class="form-group">
                <label>Select Website Package</label>
                <select id="webSelect" onchange="calculateTotal()">
                    <option value="0">None</option>
                    <option value="1500">Standard Website ($1,500)</option>
                    <option value="3000">Standard Level Web Development ($3,000)</option>
                    <option value="10000">Advanced Legend Website ($10,000)</option>
                </select>
            </div>

            <!-- Chatbot Selection -->
            <div class="form-group">
                <label>Select Chatbot Integration (One-Time Setup)</label>
                <select id="botSetupSelect" onchange="calculateTotal()">
                    <option value="0">None</option>
                    <option value="199">Fix/Add Chatbot to Existing Website ($199)</option>
                    <option value="500">Standalone Chatbot Setup ($500)</option>
                </select>
            </div>

            <!-- Subscription Selection -->
            <div class="form-group">
                <label>Monthly AI Chatbot Subscription</label>
                <select id="subSelect" onchange="calculateTotal()">
                    <option value="0">No Subscription</option>
                    <option value="49">Normal Chatbot ($49/month)</option>
                    <option value="100">Standard Chatbot ($100/month)</option>
                    <option value="200">Advanced Chatbot ($200/month)</option>
                </select>
            </div>

            <!-- Live Price Display -->
            <div class="price-display">
                Total Upfront Cost: $<span id="totalPrice">0</span> 
                <br>
                <span style="font-size: 1rem; font-weight: normal;">+ $<span id="monthlyPrice">0</span> / month</span>
            </div>

            <button type="button" onclick="checkout()">Proceed to Payment</button>
        </form>
    </div>

    <script>
        function calculateTotal() {
            // Get values from dropdowns
            const webPrice = parseInt(document.getElementById('webSelect').value);
            const botSetupPrice = parseInt(document.getElementById('botSetupSelect').value);
            const subPrice = parseInt(document.getElementById('subSelect').value);

            // Calculate totals
            const upfrontTotal = webPrice + botSetupPrice;
            const monthlyTotal = subPrice;

            // Update UI
            document.getElementById('totalPrice').innerText = upfrontTotal.toLocaleString();
            document.getElementById('monthlyPrice').innerText = monthlyTotal.toLocaleString();
        }

        function checkout() {
            const upfront = document.getElementById('totalPrice').innerText;
            if(upfront == "0" && document.getElementById('monthlyPrice').innerText == "0"){
                alert("Please select a package before proceeding.");
                return;
            }
            // Future step: Here we will redirect them to Stripe payment link
            alert("Redirecting to secure payment for $" + upfront + "...");
        }
    </script>
</body>
</html>
